@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161618;--tx:#eeeeea;--mu:#a2a29b;--zn:#2c2c31;--st:#6d6d75;--pn:#202024;--bd:#393940}}
:root[data-theme="dark"]{--bg:#161618;--tx:#eeeeea;--mu:#a2a29b;--zn:#2c2c31;--st:#6d6d75;--pn:#202024;--bd:#393940}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header,main{max-width:1280px;margin:0 auto;padding:12px 16px}
h1{font-size:1.5rem;margin:8px 0 2px;font-family:Georgia,"Times New Roman",serif}
.sub{color:var(--mu);margin:0 0 10px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tab,.chip{border:1px solid var(--bd);background:var(--pn);color:var(--tx);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
.tab[aria-pressed=true]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.tab small{opacity:.7;margin-left:4px}
select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--pn);color:var(--tx)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0;color:var(--mu);font-size:.9rem}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--st)}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:16px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.plan{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:8px}
svg{width:100%;height:auto;display:block}
.z{stroke:var(--st);stroke-width:2;cursor:pointer}
.z:hover{stroke-width:5}
.z:focus-visible,.z.sel{stroke:var(--tx);stroke-width:6;outline:none}
.s0{fill:var(--zn)}.sr{fill:var(--r)}.so{fill:var(--o)}.sy{fill:var(--y)}.sg{fill:var(--g)}
text{pointer-events:none;font-family:inherit;fill:var(--tx);text-anchor:middle}
.c text{fill:#111}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center;color:var(--mu);font-size:.9rem}
.panel{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;position:sticky;top:8px}
.panel h2{margin:0;font-size:1.2rem;font-family:Georgia,serif}
.panel p{margin:4px 0}
.mu{color:var(--mu);font-size:.92rem}
article{border-top:1px solid var(--bd);margin-top:10px;padding-top:10px}
.b{font-weight:600}
.ph a{margin-right:10px;color:inherit}
</style></head><body>

</header>

const SHEET_CSV=""; // Google E-Tablolar "Web'de yayınla" CSV bağlantınızı tırnakların arasına yapıştırın
function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const FM={"Okul Bahçesi (Dış Alan)":"S","Bodrum":"B","Zemin Kat":"Z","1. Kat":"1","2. Kat":"2"};
const LM={};Object.keys(N).forEach(k=>LM[N[k]]=k);
const GM={"FİZİKSEL":"F","GÖRME":"G","DİĞER":"D","ÇOKLU ENGELLİLİK":"C","OTİZM / NÖROÇEŞİTLİLİK":"O","İŞİTSEL":"I"};
const SNAP=R;
function csv(t){const o=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=h}else if(h=='"')q=true;else if(h==","){r.push(c);c=""}else if(h=="\n"||h=="\r"){if(h=="\r"&&t[i+1]=="\n")i++;r.push(c);o.push(r);r=[];c=""}else c+=h}
 if(c||r.length){r.push(c);o.push(r)}return o}
function conv(t){T.length=0;let skip=0;const out=[];
 for(const r of csv(t).slice(1)){if(!r[1])continue;const f=FM[r[1].trim()];if(!f){skip++;continue}
  const lk=(r[2]||"").trim();let k=LM[lk];if(!k){k=lk;N[k]=lk;LM[lk]=k}
  const ty=(r[3]||"").replace(/\s*\(.*$/,"").trim();let ti=T.indexOf(ty);if(ti<0)ti=T.push(ty)-1;
  const gn=(r[4]||"").trim().toLocaleUpperCase("tr");let g=GM[gn];if(!g){g=gn;GR[g]=gn}
  const st=r[5]||"";const s=st.includes("🔴")?"r":st.includes("⚠")?"o":st.includes("🟡")?"y":st.includes("🟢")?"g":"y";
  const ph=((r[7]||"").match(/id=([\w-]+)/g)||[]).map(x=>x.slice(3)).join(" ");
  out.push([f,k,ti,g,s,(r[6]||"").trim(),ph])}
 return {out,skip}}
async function load(){
 if(!SHEET_CSV){$("src").textContent="Örnek veri gösteriliyor (Google E-Tablolar bağlantısı henüz eklenmedi).";return}
 try{const u=SHEET_CSV+(SHEET_CSV.includes("?")?"&":"?")+"t="+Date.now();
  const txt=await (await fetch(u)).text();try{localStorage.setItem("krokiCsv",txt)}catch(e){}
  const x=conv(txt);R=x.out;$("src").textContent="Güncel: "+new Date().toLocaleString("tr-TR")+" · "+R.length+" bildirim"+(x.skip?" · "+x.skip+" satırın kat adı tanınmadı":"")}
 catch(e){let c=null;try{c=localStorage.getItem("krokiCsv")}catch(_){}
  if(c){R=conv(c).out;$("src").textContent="Çevrimdışı: son kaydedilen veri gösteriliyor."}else $("src").textContent="Veri alınamadı, örnek veri gösteriliyor."}
 all()}
$("rf").addEventListener("click",load);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
all();load();
</script></body></html>
